# Local infra (ADR-002, ADR-003, ADR-007). Postgres backs both pgvector (corpus
# retrieval, roadmap item 4) and the LangGraph checkpointer (HITL durability,
# roadmap item 9). Redis backs the LiteLLM proxy's semantic cache (ADR-018,
# roadmap item 12). mock-staging-api is added later by ADR-016/Feature 10.
#
# The `app` service (added alongside the Dockerfile/Makefile, ADR-021 era) builds
# the project image and bind-mounts the repo for live local development. It has
# no long-running server to front yet (Open Question #10 — no HTTP API designed),
# so its default command is a one-shot smoke check (see scripts/entrypoint.sh);
# `make test`/`make shell` override the command for real work.
#
# Credentials: `litellm`'s required provider keys are OPENAI_API_KEY and
# TOGETHERAI_API_KEY (frontier primaries + the guardrail primary) — come from
# infra/.env — copy infra/.env.example to infra/.env and fill in real values.
# `make check-env` (run automatically by `make up`/`smoke`/`test`/`shell`)
# validates this up front with a readable error; the `${VAR:?...}` defaults
# below are a second safety net in case this file is ever run with plain
# `docker compose` instead of `make`. ANTHROPIC_API_KEY/COHERE_API_KEY are no
# longer required (ADR-023, Feature 15, Phase 2) — the fallback aliases they
# backed now resolve to local Ollama-served models instead.
#
# `ollama` (ADR-023, Feature 15, Phase 1): local model-serving backend for the
# fallback tier's migration off paid Anthropic/Cohere models. Reached by
# `litellm` via Docker service DNS at http://ollama:11434 — the host port
# mapping below is for manual `curl`/testing only, not required for the
# litellm<->ollama link. Models are pulled separately via
# `make pull-local-models` (scripts/pull_local_models.sh), not baked into the
# image, since they're multi-GB and shouldn't surprise a plain `make up`.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment if the host has an NVIDIA GPU + nvidia-container-toolkit installed.
    # Falls back to CPU inference otherwise — slower, but functionally correct,
    # which matters for the shadow-rollout comparison in Phase 4 (ADR-023).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    depends_on:
      - redis
      - ollama
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Missing OPENAI_API_KEY - copy infra/.env.example to infra/.env and fill it in, or run make check-env}"
      TOGETHERAI_API_KEY: "${TOGETHERAI_API_KEY:?Missing TOGETHERAI_API_KEY - copy infra/.env.example to infra/.env and fill it in, or run make check-env}"
      # ANTHROPIC_API_KEY / COHERE_API_KEY retired by ADR-023 (Feature 15, Phase 2) —
      # the fallback aliases they backed now resolve to local Ollama-served models
      # (see OLLAMA_BASE_URL below and infra/litellm_config.yaml). Not deleted
      # silently: see MIGRATION_PLAN.md and PROJECT_MEMORY.md ADR-023 for why these
      # two became optional. TOGETHERAI_API_KEY stays required (sentinel-guardrail's
      # primary, untouched per ADR-023's Phase 5 scope boundary).
      OLLAMA_BASE_URL: "http://ollama:11434"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ..:/app
    working_dir: /app
    depends_on:
      - postgres
      - redis
      - litellm
    environment:
      LITELLM_PROXY_URL: http://litellm:4000
      LITELLM_VIRTUAL_KEY: ${LITELLM_VIRTUAL_KEY:-}
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
    # No long-running server yet (Open Question #10) — default command is the
    # one-shot smoke check baked into the image; `make test`/`make shell`
    # override this via `docker compose run`.
    command: ["smoke"]

volumes:
  pgdata:
  redisdata:
  ollama_models:
