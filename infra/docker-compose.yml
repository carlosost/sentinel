# Local infra (ADR-002, ADR-003, ADR-007, ADR-024). Postgres backs both pgvector
# (corpus retrieval) and the LangGraph checkpointer (HITL durability). Redis backs
# the LiteLLM proxy's semantic cache (ADR-018). mock-staging-api provides a realistic
# async boundary for the execute node (ADR-016/Feature 10, ADR-024).
#
# The `app` service builds the project image and bind-mounts the repo for live local
# development. Its default command is now `serve` (uvicorn src.api.app:app, port 8000)
# — the HTTP API is wired (ADR-024, Open Question #10 resolved). `make test`/`make shell`
# override the command for testing/debugging.
#
# Ollama runs on the HOST (not in Docker) so it can access the Metal GPU on macOS.
# On Apple Silicon this cuts inference time ~10-25x vs CPU-only Docker. Start it with:
#   OLLAMA_HOST=0.0.0.0 ollama serve
# Containers reach it via host.docker.internal:11434 (set as OLLAMA_BASE_URL below).
# Pull models once with: make pull-local-models (scripts/pull_local_models.sh).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Missing OPENAI_API_KEY - copy infra/.env.example to infra/.env and fill it in, or run make check-env}"
      # Ollama runs on the host for Metal GPU access — reached via host.docker.internal.
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"

  mock-staging-api:
    # Minimal FastAPI stub that accepts POST /execute with {tool, args} and returns
    # {success, output, error}. Provides a realistic async boundary for the `execute`
    # node (ADR-016, ADR-024) without touching real production systems.
    build:
      context: ..
      dockerfile: scripts/mock_staging_api/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ..:/app
    working_dir: /app
    depends_on:
      - postgres
      - redis
      - litellm
      - mock-staging-api
    ports:
      - "8000:8000"
    environment:
      LITELLM_PROXY_URL: http://litellm:4000
      LITELLM_VIRTUAL_KEY: ${LITELLM_VIRTUAL_KEY:-}
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      LANGSMITH_TRACING: "true"
      LANGSMITH_ENDPOINT: "https://api.smith.langchain.com"
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-sentinel}
      HF_TOKEN: ${HF_TOKEN:-}  # optional — suppresses HF Hub rate-limit warnings
    command: ["serve"]

volumes:
  pgdata:
  redisdata:
