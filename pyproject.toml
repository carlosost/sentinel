[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel — Autonomous SRE Incident Copilot (LangGraph/LangSmith learning project)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires live infra (Postgres/Redis/LiteLLM); skipped by default",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
