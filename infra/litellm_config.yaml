# LiteLLM proxy production configuration (ADR-018, Feature 12).
#
# Every alias below is one actually referenced by `model=...` in src/graph/nodes/
# or src/evals/ (grep "get_chat_client(model=\"sentinel-" / "get_embedding_client").
# client_factory.py passes these alias names straight through to the proxy — it
# never sees or constructs a raw provider model string (ADR-003).
#
# `sentinel-guardrail` (Llama Guard 3-8B + a fallback safety model) backs
# `guardrail_check()` as of Feature 13/ADR-019.
#
# ADR-023 (Feature 15, Phase 2): every chat `*-fallback` entry below and
# `sentinel-embedding-fallback` are now served locally via Ollama
# (OLLAMA_BASE_URL, infra/docker-compose.yml's `ollama` service) instead of
# Anthropic/Cohere. `format: json` forces Ollama's grammar-constrained JSON
# mode — the single highest-leverage mitigation for the "strict JSON, no
# prose" contract every chat node depends on (see Open Question #16/#17 and
# memory/features/feature-15-local-fallback-migration.md Phase 3 for the
# conformance-risk discussion). `sentinel-guardrail`/`-fallback` are
# unchanged — out of scope per ADR-023 (Phase 5, separate approval).
#
# docs/LLM_AGNOSTICISM_REVIEW.md §1.3/Item 1 (2026-06-28): the six OpenAI-served
# chat primaries below now also set `response_format: {type: json_object}`
# — the OpenAI-side structural equivalent of the Ollama fallbacks' `format:
# json` above. Before this, the fallback tier had a config-level JSON
# guarantee and the primary tier (the path carrying production traffic) did
# not — it relied on prompt text alone. See
# tests/gateway/test_litellm_config_yaml.py's
# test_every_openai_served_chat_alias_enforces_json_response_format, which
# now enforces this for any future OpenAI-served chat alias too.

model_list:
  - model_name: sentinel-router
    litellm_params:
      model: openai/gpt-4o-mini
      response_format: { type: json_object }
      fallbacks: ["sentinel-router-fallback"]
  - model_name: sentinel-router-fallback
    litellm_params:
      model: ollama_chat/llama3.1:8b-instruct-q4_K_M
      api_base: os.environ/OLLAMA_BASE_URL
      format: json

  - model_name: sentinel-grader
    litellm_params:
      model: openai/gpt-4o-mini
      response_format: { type: json_object }
      fallbacks: ["sentinel-grader-fallback"]
  - model_name: sentinel-grader-fallback
    litellm_params:
      model: ollama_chat/llama3.1:8b-instruct-q4_K_M
      api_base: os.environ/OLLAMA_BASE_URL
      format: json

  - model_name: sentinel-diagnose
    litellm_params:
      model: openai/gpt-4o
      response_format: { type: json_object }
      fallbacks: ["sentinel-diagnose-fallback"]
  - model_name: sentinel-diagnose-fallback
    litellm_params:
      model: ollama_chat/mistral-small:24b-instruct-2501-q4_K_M
      api_base: os.environ/OLLAMA_BASE_URL
      format: json

  - model_name: sentinel-propose-action
    litellm_params:
      model: openai/gpt-4o
      response_format: { type: json_object }
      fallbacks: ["sentinel-propose-action-fallback"]
  - model_name: sentinel-propose-action-fallback
    litellm_params:
      model: ollama_chat/mistral-small:24b-instruct-2501-q4_K_M
      api_base: os.environ/OLLAMA_BASE_URL
      format: json

  - model_name: sentinel-postmortem
    litellm_params:
      model: openai/gpt-4o-mini
      response_format: { type: json_object }
      fallbacks: ["sentinel-postmortem-fallback"]
  - model_name: sentinel-postmortem-fallback
    litellm_params:
      model: ollama_chat/llama3.1:8b-instruct-q4_K_M
      api_base: os.environ/OLLAMA_BASE_URL
      format: json

  - model_name: sentinel-judge
    litellm_params:
      model: openai/gpt-4o
      response_format: { type: json_object }
      fallbacks: ["sentinel-judge-fallback"]
  - model_name: sentinel-judge-fallback
    litellm_params:
      model: ollama_chat/mistral-small:24b-instruct-2501-q4_K_M
      api_base: os.environ/OLLAMA_BASE_URL
      format: json

  # docs/LLM_AGNOSTICISM_REVIEW.md §1.3/Item 5 (2026-06-28): swapping this alias's
  # primary `model` is NOT a config-only change like the chat aliases above —
  # the new model's embedding dimensionality must match what `corpora/` was
  # ingested with, or every retriever call fails loudly with
  # EmbeddingDimensionMismatchError (src/retrieval/vector_search.py,
  # Open Question #16's deliberate fail-loud resolution). Re-run
  # scripts/ingest_corpora.py against every corpus immediately after changing
  # this entry's `model`, before any traffic uses the new alias.
  - model_name: sentinel-embedding
    litellm_params:
      model: openai/text-embedding-3-small
      fallbacks: ["sentinel-embedding-fallback"]
  - model_name: sentinel-embedding-fallback
    litellm_params:
      model: ollama/bge-m3
      api_base: os.environ/OLLAMA_BASE_URL

  # ADR-023 Phase 5 (2026-07-06): sentinel-guardrail's primary migrated from
  # together_ai/meta-llama/Meta-Llama-Guard-3-8B to a locally-served Ollama
  # instance — the last paid external dependency removed.
  # `format: json` enforces JSON-constrained generation to match the custom
  # JSON prompt in src/guardrails/check.py (same pattern as all other
  # ollama_chat fallback entries). Note: Llama Guard 3 is trained as a safety
  # classifier with its own native output format; the JSON-prompt approach in
  # guardrail_check() deviates from that interface and may degrade classification
  # quality vs. the native "safe/unsafe\nSN" format — monitor GuardrailCheckError
  # rates after cutover. The fallback (openai/omni-moderation-latest) provides a
  # reliable safety net.
  - model_name: sentinel-guardrail
    litellm_params:
      model: ollama_chat/llama-guard3:8b
      api_base: os.environ/OLLAMA_BASE_URL
      # No `format: json` — Llama Guard 3 uses its native 'safe'/'unsafe\nS1'
      # format, which guardrail_check()._parse_native() handles directly.
      # JSON-constrained generation would interfere with the native format.
      fallbacks: ["sentinel-guardrail-fallback"]
  - model_name: sentinel-guardrail-fallback
    litellm_params:
      model: openai/omni-moderation-latest

# Redis-backed semantic caching, proxy-wide for application traffic. Any
# individual request can override this with `cache={"no-cache": true}` —
# the eval-determinism carve-out (ADR-018/ADR-005) — src/evals/evaluator.py
# is the one real call site that sets it today.
litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ttl: 3600
    # Semantic (embedding-similarity) cache, not exact-match-only — repeated
    # near-duplicate prompts within the same alias are still cache-eligible.
    mode: semantic
    similarity_threshold: 0.95

# Three virtual keys (ADR-018): sentinel-app/sentinel-eval/sentinel-dev, each
# with an independent rate-limit/budget so a `make eval` run can never starve
# application traffic of rate-limit headroom (and vice versa). Numeric caps
# below are placeholders pending real usage data — tracked as Open Question
# #12 in docs/PROJECT_MEMORY.md §7, not asserted as "correct" by any test.
general_settings:
  virtual_keys:
    - key_alias: sentinel-app
      rpm_limit: 600
      budget_duration: 30d
      max_budget: 200.0
    - key_alias: sentinel-eval
      rpm_limit: 120
      budget_duration: 30d
      max_budget: 50.0
    - key_alias: sentinel-dev
      rpm_limit: 60
      budget_duration: 30d
      max_budget: 20.0
