# Local infra (ADR-002, ADR-003, ADR-007, ADR-024). Postgres backs both pgvector
# (corpus retrieval) and the LangGraph checkpointer (HITL durability). Redis backs
# the LiteLLM proxy's semantic cache (ADR-018). mock-staging-api provides a realistic
# async boundary for the execute node (ADR-016/Feature 10, ADR-024).
#
# The `app` service builds the project image and bind-mounts the repo for live local
# development. Its default command is now `serve` (uvicorn src.api.app:app, port 8000)
# — the HTTP API is wired (ADR-024, Open Question #10 resolved). `make test`/`make shell`
# override the command for testing/debugging.
#
# Credentials: `litellm`'s required provider keys are OPENAI_API_KEY and
# TOGETHERAI_API_KEY (frontier primaries + the guardrail primary) — come from
# infra/.env — copy infra/.env.example to infra/.env and fill in real values.
# `make check-env` (run automatically by `make up`/`smoke`/`test`/`shell`)
# validates this up front with a readable error; the `${VAR:?...}` defaults
# below are a second safety net in case this file is ever run with plain
# `docker compose` instead of `make`. ANTHROPIC_API_KEY/COHERE_API_KEY are no
# longer required (ADR-023, Feature 15, Phase 2) — the fallback aliases they
# backed now resolve to local Ollama-served models instead.
#
# `ollama` (ADR-023, Feature 15, Phase 1): local model-serving backend for the
# fallback tier's migration off paid Anthropic/Cohere models. Reached by
# `litellm` via Docker service DNS at http://ollama:11434 — the host port
# mapping below is for manual `curl`/testing only, not required for the
# litellm<->ollama link. Models are pulled separately via
# `make pull-local-models` (scripts/pull_local_models.sh), not baked into the
# image, since they're multi-GB and shouldn't surprise a plain `make up`.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment if the host has an NVIDIA GPU + nvidia-container-toolkit installed.
    # Falls back to CPU inference otherwise — slower, but functionally correct,
    # which matters for the shadow-rollout comparison in Phase 4 (ADR-023).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    depends_on:
      - redis
      - ollama
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Missing OPENAI_API_KEY - copy infra/.env.example to infra/.env and fill it in, or run make check-env}"
      # ANTHROPIC_API_KEY / COHERE_API_KEY retired (ADR-023, Phase 2, 2026-06-28).
      # TOGETHERAI_API_KEY retired (ADR-023, Phase 5, 2026-07-06) — sentinel-guardrail
      # primary migrated to ollama_chat/llama-guard3:8b; no API key required.
      # OPENAI_API_KEY is now the sole required external provider credential.
      OLLAMA_BASE_URL: "http://ollama:11434"

  mock-staging-api:
    # Minimal FastAPI stub that accepts POST /execute with {tool, args} and returns
    # {success, output, error}. Provides a realistic async boundary for the `execute`
    # node (ADR-016, ADR-024) without touching real production systems.
    # Build context: scripts/mock_staging_api/ (simple single-file FastAPI app).
    build:
      context: ..
      dockerfile: scripts/mock_staging_api/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ..:/app
    working_dir: /app
    depends_on:
      - postgres
      - redis
      - litellm
      - mock-staging-api
    ports:
      - "8000:8000"
    environment:
      LITELLM_PROXY_URL: http://litellm:4000
      LITELLM_VIRTUAL_KEY: ${LITELLM_VIRTUAL_KEY:-}
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-sentinel}
    # Default: start the FastAPI HTTP server (ADR-024, Open Question #10 resolved).
    # Override via `docker compose run app smoke` or `docker compose run app test`.
    command: ["serve"]

volumes:
  pgdata:
  redisdata:
  ollama_models:
